# compose.prod.yml
services:
  postgres:
    image: postgres:16
    container_name: padronizaba-postgres
    hostname: padronizaba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: padronizaba
      POSTGRES_USER: padronizaba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - padronizaba-net

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: padronizaba-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - padronizaba-net

networks:
  padronizaba-net:
    driver: bridge