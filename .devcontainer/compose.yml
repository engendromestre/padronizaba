services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../:/home/node/app:cached
    working_dir: /home/node/app
    command: sleep infinity
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://padronizaba:padronizaba@postgres:5432/padronizaba
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - padronizaba-dev

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: padronizaba
      POSTGRES_USER: padronizaba
      POSTGRES_PASSWORD: padronizaba
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql  # 👈
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padronizaba"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - padronizaba-dev

volumes:
  postgres-data:

networks:
  padronizaba-dev:
    driver: bridge