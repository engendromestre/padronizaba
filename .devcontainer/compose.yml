services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../:/home/node/app:cached
    working_dir: /home/node/app
    command: sleep infinity
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://padronizaba:padronizaba@postgres:5432/padronizaba
    depends_on:
      - postgres
    networks:
      - padronizaba-dev

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: padronizaba
      POSTGRES_USER: padronizaba
      POSTGRES_PASSWORD: padronizaba
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - padronizaba-dev

volumes:
  postgres-data:

networks:
  padronizaba-dev:
    driver: bridge