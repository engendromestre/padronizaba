name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
  NEXTAUTH_URL: http://127.0.0.1:3000
  AUTH_TRUST_HOST: "true"
  SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
  SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}

jobs:
  # ── Job 1: Qualidade de código ───────────────────────────────────
  quality:
    name: Lint & Types
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run lint
        run: npm run lint

      - name: Check types
        run: npx tsc --noEmit

  # ── Job 2: Testes unitários ──────────────────────────────────────
  unit:
    name: Unit Tests
    runs-on: self-hosted
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: padronizaba
          POSTGRES_PASSWORD: padronizaba
          POSTGRES_DB: padronizaba_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U padronizaba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://padronizaba:padronizaba@localhost:5433/padronizaba_test
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit tests
        run: npm run test:unit

  # ── Job 3: Testes E2E ────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: self-hosted
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: padronizaba
          POSTGRES_PASSWORD: padronizaba
          POSTGRES_DB: padronizaba_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U padronizaba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://padronizaba:padronizaba@localhost:5433/padronizaba_test
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma Migrations
        run: npx prisma migrate deploy

      - name: Run Seed
        run: npm run seed

      - name: Install Playwright browsers
        run: npx playwright install chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 0

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Job 4: Build ─────────────────────────────────────────────────
  build:
    name: Build Check
    runs-on: self-hosted
    needs: [unit, e2e]
    env:
      DATABASE_URL: postgresql://padronizaba:padronizaba@localhost:5433/padronizaba_test
      SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp-relay.brevo.com' }}
      SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
      SMTP_SECURE: "false"
      SMTP_USER: ${{ secrets.SMTP_USER || 'mock@smtp-brevo.com' }}
      SMTP_PASS: ${{ secrets.SMTP_PASS || 'mock_pass_for_build' }}
      MAIL_FROM: ${{ secrets.MAIL_FROM || 'noreply@padronizaba.com.br' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build