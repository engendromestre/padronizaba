name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    env:
      SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
      SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy code to VPS
        run: |
          rsync -av --exclude='.git' --exclude='node_modules' \
            $GITHUB_WORKSPACE/ /opt/padronizaba/

      - name: Build new image
        run: |
          cd /opt/padronizaba
          docker compose -f docker-compose.prod.yml build app

      - name: Generate Prisma Client
        run: |
          cd /opt/padronizaba
          docker compose -f docker-compose.prod.yml run --rm app npx prisma generate

      - name: Run database migrations
        run: |
          cd /opt/padronizaba
          docker compose -f docker-compose.prod.yml run --rm app npx prisma migrate deploy

      - name: Restart containers
        run: |
          cd /opt/padronizaba
          docker compose -f docker-compose.prod.yml up -d --no-deps app

      - name: Wait for app to be healthy
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000 && echo "✅ App online!" && exit 0
            echo "Aguardando app... ($i/20)"
            sleep 3
          done
          echo "❌ App não respondeu a tempo"
          exit 1

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deploy falhou! Revertendo para imagem anterior..."
          cd /opt/padronizaba
          docker compose -f docker-compose.prod.yml up -d --no-deps app