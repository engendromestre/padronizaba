name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest changes
        run: |
          cd /opt/padronizaba
          git pull origin main

      - name: Build new image
        run: |
          cd /opt/padronizaba
          docker compose -f docker-compose.prod.yml build app

      - name: Run database migrations
        run: |
          cd /opt/padronizaba
          docker compose -f docker-compose.prod.yml run --rm app npx prisma migrate deploy

      - name: Generate Prisma Client
        run: |
          cd /opt/padronizaba
          docker compose -f docker-compose.prod.yml run --rm app npx prisma generate

      - name: Run production seed
        run: |
          cd /opt/padronizaba
          docker compose -f docker-compose.prod.yml run --rm app npm run seed:prod
        env:
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}

      - name: Restart containers
        run: |
          cd /opt/padronizaba
          docker compose -f docker-compose.prod.yml up -d