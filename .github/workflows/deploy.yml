name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest changes
        run: |
          cd /opt/padronizaba
          git pull origin main

      - name: Build and restart containers
        run: |
          cd /opt/padronizaba
          docker compose up -d --build

      - name: Run migrations
        run: |
          cd /opt/padronizaba
          docker compose exec app npx prisma migrate deploy