name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest changes
        run: |
          cd /opt/padronizaba
          git pull origin main

      # Rodar a migração ANTES de compilar o novo container
      - name: Run database migrations
        run: |
          cd /opt/padronizaba
          # Rodamos o migrate usando um container temporário para preparar o banco de dados
          docker compose run --rm app npx prisma migrate deploy

      # Buildar e reiniciar os containers já com o banco atualizado
      - name: Build and restart containers
        run: |
          cd /opt/padronizaba
          docker compose up -d --build

      # Se o seu Dockerfile não rodar o prisma generate internamente no build:
      - name: Regenerate Prisma Client inside container
        run: |
          cd /opt/padronizaba
          docker compose exec -T app npx prisma generate