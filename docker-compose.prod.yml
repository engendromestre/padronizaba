services:
  postgres:
    image: postgres:16
    container_name: padronizaba-postgres
    hostname: padronizaba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - npm-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: padronizaba-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - npm-network

networks:
  npm-network:
    external: true
